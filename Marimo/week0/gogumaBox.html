<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .box {
      width: 100px;
      height: 100px;
      background-color: purple;
      color: white;
      box-sizing: border-box;
      position: relative;
      top: -50px;
      right: -210px;
    }
    .escape {
      position: relative;
      top: -120px;
      right: -200px;
      background-color: yellow;
    }
  </style>
</head>

<body>
  <div class="box">BOX</div>
  <h1>고구마 상자</h1>
  <text class="escape">그동안 고마웠구마</text>
</body>

</html>
