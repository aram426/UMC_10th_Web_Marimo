<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Block vs Inline Elements</title>
    <style>
        .block1{
            padding: 10px;
            background-color: lightblue;
            width: 70px
        }
        .block2{
            padding: 10px;
            background-color: lightgreen;
            width:300px;
        }
        .block3{
            padding: 10px;
            background-color: lightcoral;
            width: 100px;
        }
        .block4{
            padding: 10px;
            background-color: lightyellow;
            width: 100px;
            margin: 20px;
        }


        .span1{
            padding: 10px;
            background-color: lightblue;
        }
        .span2{
            padding: 10px;
            background-color: lightgreen;
        }
        .span3{
            padding: 10px;
            background-color: lightcoral;
        }

        .inline-block {
            display: inline-block;
            width: 300px;
            height: 200px;
            background-color: tomato;
        }

    </style>
</head>
<body>
    <div class="block1">작은블록!</div>
    <div class="block2">커다란블록!</div>
    <div class="block3">애매한블록!</div>
    <div class="block4">마진이추가된블록!</div>

    <span class="span1">이것이</span>
    <span class="span2">인라인</span>
    <span class="span3">인것인!</span>
    <span class="span1">절거운!</span>
    <span class="span2">실습시간이어유</span>

    <div class="inline-block">인라인블록!</div>
</body>
